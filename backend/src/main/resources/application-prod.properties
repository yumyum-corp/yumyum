# No local database, JWT or OAuth fallback in deployment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
ai.fastapi.url=${AI_FASTAPI_URL}

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI}
frontend.redirect-url=${FRONTEND_REDIRECT_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Backend must only be reachable through the trusted Nginx proxy.
# Nginx must overwrite incoming forwarded headers with its own values.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
